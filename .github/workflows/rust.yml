name: Rust
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.1
      - run: cargo check --locked --all-targets

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked
      - run: python scripts/integration.py
      - run: python scripts/test_proxy_auth.py
      - run: python scripts/test_service_rust.py
      - run: cargo build --locked --release
      - uses: actions/upload-artifact@v4
        with:
          name: agent-router-${{ matrix.os }}
          path: |
            target/release/agent-router
            target/release/agent-router.exe
          if-no-files-found: error

  gui:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - run: cargo clippy --locked -p agent-router-gui --all-targets -- -D warnings
      - run: cargo test --locked -p agent-router-gui
      - run: cargo build --locked --release -p agent-router-gui
      - if: runner.os == 'macOS'
        run: ./scripts/bundle_macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: agent-router-gui-${{ matrix.os }}
          path: |
            target/release/agent-router-gui
            target/release/agent-router-gui.exe
            target/release/agent-router-daemon
            target/release/agent-router-daemon.exe
            target/Agent Router.app
          if-no-files-found: error
