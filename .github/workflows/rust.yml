name: Rust
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.1
      - run: cargo check --locked --all-targets

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
      - run: cargo build --locked
      - run: cargo build --locked --release
      - uses: actions/upload-artifact@v4
        with:
          name: coport-${{ matrix.os }}
          path: |
            target/release/coport
            target/release/coport.exe
          if-no-files-found: error

  gui:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test "gui/tests/*.test.cjs"
      - run: cargo clippy --locked -p coport-gui --all-targets -- -D warnings
      - run: cargo test --locked -p coport-gui
      - run: cargo build --locked --release -p coport-gui
      - if: runner.os == 'macOS'
        run: ./scripts/bundle_macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: coport-gui-${{ matrix.os }}
          path: |
            target/release/coport-gui
            target/release/coport-gui.exe
            target/release/coportd
            target/release/coportd.exe
            target/Coport.app
          if-no-files-found: error
