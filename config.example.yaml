# Shared server settings. Restart after changing YAML.
listen_port: 8787
request_timeout_seconds: 300

# HTTP CONNECT, HTTPS CONNECT or SOCKS5; explicit ports required.
proxies:
  us: "http://127.0.0.1:8101"
  jp: "socks5://127.0.0.1:8102"
  claude_official: "http://127.0.0.1:7893"

codex:
  base_url:
    account: "https://chatgpt.com/backend-api"
  auth_file: "~/.codex/auth.json"
  # auth_env: CHATGPT_ACCESS_TOKEN # Alternative to auth_file, not both.
  account_auth_file_only: true
  routing:
    account:
      default: [us, jp]
      # "you@example.com": jp # ID/email/username takes priority over default.
    # account_fallback: jp
    # mcp_fallback: jp # Public documentation MCP; omitted means direct.

claude:
  base_url: "https://api.anthropic.com" # Root without /v1.
  auth_file: "~/.claude/.credentials.json"
  # auth_env: CLAUDE_CODE_OAUTH_TOKEN # Alternative to auth_file, not both.
  account_auth_file_only: true
  routing:
    account:
      default: claude_official
      # "you@example.com": claude_official # UUID/email/name precedes default.
    # account_probe: claude_official # OAuth account identity probe when file-only is false.
    # account_fallback: claude_official
  # With account_auth_file_only: false, other tokens are identified via profile API.
  # account_probe supplies the lookup proxy before the account is known.
  # If omitted, account_fallback supplies it for backward compatibility.
  # With true, unmatched tokens are rejected even when a fallback exists.

# Omit API Key entries unless configured. To enable them, add under routing:
# codex.routing.api_key.OPENAI_API_KEY: us
# claude.routing.api_key.ANTHROPIC_API_KEY: claude_official
# Codex also accepts provider IDs. Its API base defaults to https://api.openai.com/v1;
# configure codex.base_url.api_key only to select a different default upstream.
# Every proxy choice accepts a name, none, or an ordered list such as [us, jp].
# Lists probe the upstream origin before sending; all failed -> 502, no replay.
# Both apps support explicit upstream URL routes without local credential lookup:
# codex.routing.api_key."provider.example.com/v1": [jp, us]
# Codex client base: http://127.0.0.1:8787/codex/https://provider.example.com/v1
# A third-party Claude API can also be matched by its configured upstream:
# claude.routing.api_key."182.92.106.196:6060": none
# Its client base URL: http://127.0.0.1:8787/https://182.92.106.196:6060
# This route uses the supplied API credential and does not require a fallback.
# Claude Code settings.json env:
#   ANTHROPIC_BASE_URL: http://127.0.0.1:8787/anthropic
# Outbound proxies belong here, not in Claude's environment.

# URL routing keys may omit https:// and /v1. A host-only key matches all paths;
# an explicit path wins when it is the longest matching path prefix.
