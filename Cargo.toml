[package]
name = "coport"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Cross-platform loopback HTTP/SSE proxy with credential-based outbound routing"

[workspace]
members = ["gui"]

[dependencies]
async-stream = "0.3"
base64 = "0.22"
bytes = "1"
clap = { version = "4", features = ["derive"] }
dirs = "6"
dotenvy = "0.15"
futures-util = "0.3"
flate2 = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
httparse = "1"
native-tls = "0.2"
ring = "0.17"
tokio-native-tls = "0.3"
hyper-util = { version = "0.1", features = ["tokio"] }
percent-encoding = "2"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "native-tls-vendored", "stream", "socks"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
tempfile = "3"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
toml = "0.9"
url = "2"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

[[test]]
name = "integration"
path = "scripts/tests/integration.rs"

[[test]]
name = "proxy_auth"
path = "scripts/tests/proxy_auth.rs"

[[test]]
name = "systemd"
path = "scripts/tests/systemd.rs"
