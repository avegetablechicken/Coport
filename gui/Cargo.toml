[package]
name = "agent-router-gui"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Menu bar / system tray panel for agent-router"
publish = false
default-run = "agent-router-gui"

[[bin]]
name = "agent-router-gui"
path = "src/main.rs"

[[bin]]
name = "agent-router-daemon"
path = "src/daemon_main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
agent-router = { path = ".." }
arboard = { version = "3", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "6"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "socks"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tempfile = "3"
tokio = { version = "1", features = ["full"] }
toml = "0.9"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }
