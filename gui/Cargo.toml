[package]
name = "coport-gui"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Menu bar / system tray panel for coport"
publish = false
default-run = "coport-gui"

[[bin]]
name = "coport-gui"
path = "src/main.rs"

[[bin]]
name = "coportd"
path = "src/daemon_main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
coport = { path = ".." }
arboard = { version = "3", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "6"
httparse = "1"
ring = "0.17"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "socks"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-dialog = "2"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
toml = "0.9"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
